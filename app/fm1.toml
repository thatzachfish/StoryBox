# AMB-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "StoryBox"                   # the build's files: amb.fwsc, amb-X.Y.fwsc
id_prefix = "FM-1_517"           # StoryBox's package identity (dev FM-1_51700, releases FM-1_517XXYYZZ)
usb_manufacturer = "StoryBox"
usb_product = "StoryBox FM-1"
ble = true                     # StoryBox 0.6: the radio, for Bluetooth audio out (and Bluetooth MIDI with a computer)
ble_stack = "own"              # fm1-base's own stack (Optimist's): nothing of JieLi's linked
bt_audio = true                # the sound to headphones and speakers (A2DP, SBC); the Bluetooth page
bt_audio_sim = true            # (the simulator's stand-in, for the tests)
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
ram_layout = "packed"         # StoryBox: the RAM code, .data/.bss and the pool in one budget (464 KB): the pool was
                               # full while .bss had 45 KB spare
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "A storytelling music box for the FM-1"
repo = "https://github.com/thatzachfish/storybox"
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "thatzachfish"
description = "StoryBox turns the M-VAVE FM-1 into a generative music box for storytelling: stories with acts you can play in any order, smooth or slow transitions, track mutes and breakdowns, a lead voice with a looper and punch-in effects. A fork of AMB-1 by Charles Vestal."
tags = ["ambient", "generative", "fm"]
install = "https://thatzachfish.github.io/storybox/install/"
site = "https://thatzachfish.github.io/storybox/"
screenshot = "docs/img/screen-garden.png"
