# SPDX-License-Identifier: MPL-2.0
# StoryBox's release: built from source on GitHub by the shared FM-1 builder, its packages signed with build
# provenance (BUILDING.md, Publishing a release). From fm1-base's template, as LOOM-8's; after X0X's
# (charlesvestal/fm1-x0x#25, by Kerem Kilic) and Melodee's (keremimo/melodee 4f5fb6d).
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
    branches: [main]                 # StoryBox: every change on main becomes the "latest" build (below)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: StoryBox
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # (the versions base/tools/build.py --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=storybox
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/), at the
        # commits this one links
        git submodule update --init --recursive
        # the fonts' OpenType features (base/tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        # Emscripten for the .rfm1 (host apps: RemoteFM1), a fixed version from emsdk at a fixed commit
        git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
        set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
        emcc --version
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
          # (the tests check the update path against app/build/$pkg.fwsc: there, the release package itself)
          cp "app/build/$pkg-$version.fwsc" "app/build/$pkg.fwsc"
          # the app for host apps (base/README.md, .rfm1)
          ./build.sh --rfm1 --release "$version"
          cp "app/build/$pkg-$version.rfm1" build/release-assets/
        else
          ./build.sh
          cp "app/build/$pkg.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
          ./build.sh --rfm1
          cp app/build/rfm1/"$pkg"-dev+*.rfm1 "build/release-assets/$pkg.rfm1"
        fi
        # the firmware described for hubs (base/docs/FIRMWARE-JSON.md)
        cp app/build/firmware.json build/release-assets/
        # StoryBox: crash addresses to functions (a crash record's pc, ret and e lines), printed to this log
        OBJ="$HOME/.jieli/toolchain/common/bin/objdump"
        if [ -x "$OBJ" ]; then "$OBJ" -t "app/build/$pkg.elf" > app/build/syms.txt 2>&1 || true; fi
        wc -l app/build/syms.txt 2>&1 | sed 's/^/CRASHTOOL /' || true
        for A in 0x2028878 0x2025d3e 0x20281fc 0x2027f56 0x2029320 0x20291c2; do
          "$OBJ" -d -l --start-address=$((A - 0x40)) --stop-address=$((A + 0x10)) "app/build/$pkg.elf" 2>&1 | tail -60 | sed 's/^/CRASHDIS /' || true
        done
        "$OBJ" --version 2>&1 | head -2 | sed 's/^/CRASHDIS /' || true
        python3 - app/build/syms.txt 2028878 2025d3e 20281fc 2027f56 2029320 20291c2 <<'PY' || true
        import re, sys
        syms = []
        for l in open(sys.argv[1], errors="replace"):
            m = re.match(r"^([0-9a-f]{8})\s.*\s([FO]|\s)\s+\S+\s+([0-9a-f]{8})\s+(\S+)$", l.strip())
            if m:
                syms.append((int(m.group(1), 16), int(m.group(3), 16), m.group(4)))
        print("CRASHSYM symbols", len(syms))
        for a in sys.argv[2:]:
            x = int(a, 16)
            hit = [s for s in syms if s[0] <= x < s[0] + max(s[1], 1)]
            near = max((s for s in syms if s[0] <= x), default=(0, 0, "?"))
            print(f"CRASHSYM {a} = {hit[0][2] if hit else near[2]} + {x - (hit[0][0] if hit else near[0]):#x}")
        PY
      test: |
        set -euo pipefail
        pkg=storybox
        [ -f "app/build/$pkg.fwsc" ]
        sh tests/run_tests.sh
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin build/release-assets/*.rfm1 \
              build/release-assets/firmware.json; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # StoryBox: the newest build of main, always at one address: releases/tag/latest (a prerelease, replaced each
      # time; the file itself at releases/download/latest/storybox.fwsc). (Its own job stopped starting: here instead)
      - name: Replace the latest build
        if: github.ref == 'refs/heads/main'
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd build/release-assets
          gh release delete latest --cleanup-tag --yes || true
          notes="The newest StoryBox build, from commit ${GITHUB_SHA:0:7} ($(date -u +'%Y-%m-%d %H:%M UTC')).

          Download **storybox.fwsc** below. Try it in the browser emulator (https://joakimeriksson.github.io/fm1-emu/, open the file), or install it on an FM-1 with the FM-1 Firmware Hub. Installing firmware is at your own risk; holding OCT- while powering on is the USB rescue."
          gh release create latest --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "StoryBox: latest build" --notes "$notes" storybox.fwsc firmware.json
